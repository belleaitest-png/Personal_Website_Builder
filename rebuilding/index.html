    <style>

      p + p { margin-top: 16px; }
      em { color: #F2EEE8; }
      nav { margin-top: 36px; display: flex; gap: 28px; flex-wrap: wrap; }
      a {
        color: #F2EEE8;
        font-size: 1.2rem;
        text-decoration: none;
